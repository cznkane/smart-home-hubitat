name: School calendar tests
on:
  pull_request:
    paths:
      - 'school_calendar/**'
      - '.github/workflows/school-calendar-tests.yml'
  push:
    branches:
      - feature/lisd-academic-calendar-engine
    paths:
      - 'school_calendar/**'
      - '.github/workflows/school-calendar-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run school calendar unit tests
        run: python -m unittest discover -s school_calendar -p 'test_*.py' -v

